# Builder confiável da Loja Demo (CORE-14). Os repositórios de produção chamam este workflow; quem assina a
# proveniência é ESTE arquivo (o "signer workflow" da atestação), e não o workflow do repositório que chama.
# Por isso a verificação aceita só artefatos assinados daqui: o repositório de produção não consegue forjar a
# proveniência mudando o próprio workflow.
#
# Garantias:
#   - roda só no branch principal do repositório que chama (recusa qualquer outro ref);
#   - constrói e publica a imagem; não roda testes nem hooks depois do build;
#   - a imagem é um manifest único linux/amd64, que roda igual em docker, no ECS e no Lambda (mesmo digest);
#   - a proveniência (SLSA v1) é gerada e assinada pelo GitHub (Sigstore), fora do alcance dos passos do build.
# Antes de usar fora da demo, fixe cada action pelo SHA completo do commit.
name: builder confiável

on:
  workflow_call:
    outputs:
      image:
        description: Nome da imagem no GHCR, sem tag
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Digest da imagem publicada (sha256:...)
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Só o branch principal
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::o builder só constrói o branch principal (ref: $GITHUB_REF)"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Construir e publicar no GHCR
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Um manifest só, linux/amd64, sem os manifests de atestação do BuildKit: o Lambda não aceita índice
          # OCI com atestação, e a proveniência oficial é a do passo seguinte (assinada pelo GitHub, Sigstore)
          docker buildx build --pull --platform linux/amd64 --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$image:$GITHUB_SHA" --push --metadata-file "$RUNNER_TEMP/build.json" .
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")
          media=$(docker buildx imagetools inspect --raw "$image@$digest" | jq -r .mediaType)
          case "$media" in
            *manifest.v1+json|*manifest.v2+json) ;;
            *) echo "::error::esperado um manifest único, veio $media"; exit 1 ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$image@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Proveniência assinada pela plataforma
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
